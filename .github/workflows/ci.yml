name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with package.json#packageManager and .nvmrc-equivalent below.
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Server barrel-import guard
        run: pnpm run check:server-barrels

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Clean-build assertion (T9): a real build must never write a
      # tracked-and-then-modified file, or drop a new untracked file
      # outside the already-gitignored build-output directories
      # (dist/.next/.turbo/*.tsbuildinfo — CLAUDE.md Rule 3, "no committed
      # build output"). `git status --porcelain` is empty iff nothing
      # changed relative to the checked-out commit.
      - name: Assert build left the working tree clean
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::pnpm run build modified/added tracked-relevant files — build output must stay gitignored:"
            echo "$dirty"
            exit 1
          fi
          echo "Working tree clean after build."

  verify-jwt-guard:
    name: verify_jwt drift guard (EDGE_AUDIT M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No pnpm install needed — scripts/ci/verify-jwt-guard.ts is
      # deliberately dependency-free (same convention as
      # scripts/ci/rls-cross-tenant-probe.ts), plain node:fs/node:path.
      - run: node --experimental-strip-types scripts/ci/verify-jwt-guard.ts

  repo-hygiene:
    name: Repo hygiene (large files, no stray compiled JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Large-file guard (CLAUDE.md Rule 3 — "no committed build output,
      # binaries"). Scoped to this build's own tree (`legacy/` is the
      # pre-existing old codebase kept read-only for reference —
      # SYSTEM_DESIGN §14 — and predates this rule; it is deliberately not
      # policed here). Threshold: 1MB, matching this task's brief.
      - name: Large file guard (>1MB, excluding legacy/)
        run: |
          large=$(git ls-files -z \
            | grep -zv '^legacy/' \
            | xargs -0 -I{} sh -c 'test -f "{}" && stat -c "%s %n" "{}"' 2>/dev/null \
            | awk '$1 > 1048576 {print}')
          if [ -n "$large" ]; then
            echo "::error::Tracked file(s) over 1MB found outside legacy/ (bytes, path):"
            echo "$large"
            exit 1
          fi
          echo "No tracked file outside legacy/ exceeds 1MB."
      # No-stray-JS guard (CLAUDE.md Rule 3 — "no compiled-JS siblings").
      # Flags a committed `.js` file sitting next to a same-named `.ts`/
      # `.tsx` source file — the old repo's own failure mode this rule
      # exists to prevent. `legacy/` excluded for the same reason as above.
      - name: No stray compiled .js next to .ts/.tsx source (excluding legacy/)
        run: |
          stray=""
          for f in $(git ls-files '*.js' | grep -v '^legacy/'); do
            base="${f%.js}"
            if [ -f "${base}.ts" ] || [ -f "${base}.tsx" ]; then
              stray="${stray}${f}\n"
            fi
          done
          if [ -n "$stray" ]; then
            echo "::error::Compiled .js file(s) committed next to their .ts/.tsx source:"
            printf '%b' "$stray"
            exit 1
          fi
          echo "No stray compiled .js siblings found."

  e2e:
    name: Playwright E2E (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Deliberately NOT running `supabase start` here (T9) — the
      # authenticated specs (dashboard-realtime, forwarding-wizard,
      # admin-aal2-authenticated) self-skip whenever
      # `isLocalSupabaseReachable()` is false (apps/web/tests/e2e/support/
      # auth-state.ts), which is exactly this job's situation, so they no-op
      # cleanly rather than failing. Wiring a real `supabase start` +
      # `supabase functions serve` here is future work if a maintainer wants
      # full authenticated coverage in CI — see docs/DEPLOY.md's E2E section
      # and docs/BUILD_NOTES.md's T9 entry for exactly what that would need.
      - name: Run Playwright specs
        working-directory: apps/web
        env:
          # `next build`/`next start` need *some* value for these (see
          # src/lib/env.ts) — intentionally unreachable placeholders, never
          # a real project, matching apps/web/.env.local's own local-dev
          # placeholders. `SUPABASE_URL`/`SUPABASE_SECRET_KEY` are
          # deliberately left UNSET here — that pair (not mere presence, but
          # a `127.0.0.1`/`localhost` host) is what
          # `isLocalSupabaseReachable()` gates the authenticated specs on;
          # setting them to a placeholder pair would make those specs try to
          # reach that placeholder host instead of skipping cleanly. See
          # apps/web/tests/e2e/support/auth-state.ts.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder"
          SIGNUP_DRAFT_SECRET: "ci-placeholder-secret-not-for-prod"
          APP_BASE_URL: "http://localhost:3000"
        run: pnpm exec playwright test

  migrations-check:
    name: Migrations check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for migrations
        id: migrations
        run: |
          count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.migrations.outputs.count != '0'
        with:
          version: latest
      - uses: pnpm/action-setup@v4
        if: steps.migrations.outputs.count != '0'
      - uses: actions/setup-node@v7
        if: steps.migrations.outputs.count != '0'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # `supabase start` applies every migration in supabase/migrations/ (in
      # filename order) plus supabase/seed/*.sql against a fresh local
      # Postgres in Docker (ubuntu-latest runners ship Docker preinstalled)
      # — this is the real schema-syntax + FK/constraint + RLS-policy
      # verification, not just a lint pass. `supabase db lint` then runs
      # plpgsql_check against every schema in that already-running local
      # database. --fail-on warning makes a real finding block the job
      # (verified current flag/behavior against supabase.com/docs, Rule 1:
      # default fail-on is "none", which would otherwise always exit 0).
      - name: supabase start (applies all migrations + seed)
        if: steps.migrations.outputs.count != '0'
        run: supabase start
      - name: supabase db lint
        if: steps.migrations.outputs.count != '0'
        run: supabase db lint --fail-on warning
      # `supabase db diff --linked` (schema drift against a linked hosted
      # project) is a separate, deliberately NOT-wired check: it needs a
      # real Supabase project + SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_ID
      # repo secrets that don't exist yet at this stage of the build —
      # tracked as a deploy-time follow-up in docs/DEPLOY.md, not a T1 gap.
      #
      # EDGE_AUDIT M2 (docs/audit/EDGE_AUDIT.md, docs/BUILD_NOTES.md's M2
      # entry): pins the actual "hot-path abort cancels the underlying query"
      # claim against this job's already-running REAL local Postgres, since
      # no unit test (mocked or otherwise) can demonstrate a server-enforced
      # GUC actually canceling server-side work. `pnpm install` here is
      # scoped by `--filter` to `@heyloo/edge-functions` only (the one
      # package that declares `postgres` as a devDependency for this exact
      # script), not a full-workspace install.
      - name: Install @heyloo/edge-functions deps (for statement-timeout-check.ts)
        if: steps.migrations.outputs.count != '0'
        run: pnpm --filter @heyloo/edge-functions... install --frozen-lockfile
      - name: Export local Supabase DB URL
        if: steps.migrations.outputs.count != '0'
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env
          set +a
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: statement_timeout cancellation check (EDGE_AUDIT M2)
        if: steps.migrations.outputs.count != '0'
        run: node --experimental-strip-types supabase/functions/_shared/statement-timeout-check.ts
      - name: No migrations yet
        if: steps.migrations.outputs.count == '0'
        run: echo "::notice::No migrations in supabase/migrations/ yet (T1) — nothing to lint. Placeholder job, no-op."

  rls-probe:
    name: RLS cross-tenant probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for migrations
        id: migrations
        run: |
          count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.migrations.outputs.count != '0'
        with:
          version: latest
      - uses: actions/setup-node@v7
        if: steps.migrations.outputs.count != '0'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: supabase start (applies all migrations + seed)
        if: steps.migrations.outputs.count != '0'
        run: supabase start
      # `supabase status -o env` prints the local project's connection
      # details in shell-sourceable KEY=VALUE form (API_URL, ANON_KEY,
      # SERVICE_ROLE_KEY, among others — verify current field names against
      # `supabase status --help`/supabase.com/docs if this step starts
      # failing to source correctly, Rule 1) — remapped here to the names
      # scripts/ci/rls-cross-tenant-probe.ts reads (SUPABASE_URL,
      # SUPABASE_PUBLISHABLE_KEY/SUPABASE_ANON_KEY,
      # SUPABASE_SECRET_KEY/SUPABASE_SERVICE_ROLE_KEY — the script accepts
      # either naming).
      - name: Export local Supabase connection env
        if: steps.migrations.outputs.count != '0'
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Run RLS cross-tenant probe
        if: steps.migrations.outputs.count != '0'
        run: node --experimental-strip-types scripts/ci/rls-cross-tenant-probe.ts
      - name: No migrations yet
        if: steps.migrations.outputs.count == '0'
        run: echo "::notice::No migrations in supabase/migrations/ yet (T1) — nothing to probe. Placeholder job, no-op."

  cron-queues-check:
    name: Cron jobs + pgmq queues check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for migrations
        id: migrations
        run: |
          count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.migrations.outputs.count != '0'
        with:
          version: latest
      - uses: actions/setup-node@v7
        if: steps.migrations.outputs.count != '0'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure psql is available
        if: steps.migrations.outputs.count != '0'
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: supabase start (applies all migrations + seed)
        if: steps.migrations.outputs.count != '0'
        run: supabase start
      # DB_URL is `-o env`'s default name for the local Postgres connection
      # string (confirmed against github.com/supabase/cli's current
      # `status-values.ts` — supabase.com's docs site is egress-blocked from
      # every build agent's environment, Rule 1 item 2 fallback; see
      # docs/VERIFY.md).
      - name: Export local Supabase DB URL
        if: steps.migrations.outputs.count != '0'
        run: |
          supabase status -o env > /tmp/supabase-status.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env
          set +a
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Run cron jobs + pgmq queues check
        if: steps.migrations.outputs.count != '0'
        run: node --experimental-strip-types scripts/ci/cron-queues-check.ts
      - name: No migrations yet
        if: steps.migrations.outputs.count == '0'
        run: echo "::notice::No migrations in supabase/migrations/ yet (T1) — nothing to check. Placeholder job, no-op."

  site-perf-budget:
    name: Site perf budget (marketing home)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `scripts/site-perf/measure.ts` resolves this same
      # `@playwright/test` copy at runtime (`node:module`'s
      # `createRequire`, see that file's own docstring) — installing the
      # Chromium browser once here, exactly like the `e2e` job above,
      # covers both.
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Same "unreachable placeholder" values the `e2e` job above sets
      # (apps/web/src/lib/env.ts) — a production `next build`/`next
      # start` needs *some* value for these, never a real project.
      # `measure.ts` also defaults them itself (for a local run outside
      # CI), so this is belt-and-suspenders, not load-bearing here.
      - name: WEBSITE_CREATIVE_BRIEF.md perf budget (LCP / CLS / initial JS)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_placeholder"
          SIGNUP_DRAFT_SECRET: "ci-placeholder-secret-not-for-prod"
        run: node --experimental-strip-types scripts/site-perf/measure.ts
