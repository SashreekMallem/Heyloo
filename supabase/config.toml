# Supabase CLI project config — stub.
#
# This is intentionally minimal. T1 (supabase/migrations/) and T3
# (supabase/functions/voice-*) fill in the real project_id, auth hook
# wiring, and per-function settings as those pieces land. Until then this
# file exists so `supabase` CLI commands (db lint, db diff, functions
# serve) have a valid project root to run against in CI and locally.
#
# Verify every section below against the current Supabase CLI config
# reference (supabase.com/docs/guides/local-development/cli/config) before
# adding real values — schema changes across CLI versions.

project_id = "heyloo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

# Custom Access Token Hook (tenant_id/role/platform_admin/referral_partner_id
# in app_metadata) — SYSTEM_DESIGN §2/§6, CLAUDE.md Rule 2, BACKEND_SPEC
# §3.1/§11.2. Function defined in
# supabase/migrations/20260907131400_functions_triggers.sql. Verified
# against current supabase.com/docs (Rule 1): the uri form is
# pg-functions://<database>/<schema>/<function-name>; local dev requires a
# `supabase stop && supabase start` cycle (not just `db reset`) to pick up
# a config.toml hook change.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true

[edge_runtime]
enabled = true

[analytics]
enabled = false

# Seed data (supabase/seed/seed.sql) — platform_settings price cards + one
# demo tenant per vertical with resources/offerings/hours for local dev.
# Runs after all migrations, on first `supabase start` and every
# `supabase db reset`. No real credentials — see supabase/seed/seed.sql header.
[db.seed]
enabled = true
sql_paths = ['./seed/*.sql']

# ── Edge Function verify_jwt settings (T3, supabase/functions/) ───────────
# CLAUDE.md: "triple-check — the OLD repo died by getting this inverted."
# `verify_jwt = false` means Supabase's platform-level JWT gate is OFF and
# the function implements its OWN auth (HMAC webhook signature, decoded JWT
# claims check, shared cron secret) — BACKEND_SPEC §7 table, function by
# function:
#   - Retell/Stripe/Twilio/Square/outreach webhooks: false (raw-body HMAC,
#     verified before any parsing — fail closed on a missing/bad signature).
#   - api-demo-agent: false (public marketing-site flow, no auth required to
#     call; abuse mitigated by the marketing site's own rate-limit/CAPTCHA
#     layer, not this function).
#   - worker-*/job-*: false (invoked only by pg_cron's pg_net.http_post with
#     a shared `CRON_INVOKE_SECRET` header this function checks itself —
#     never meant to be called by an end user).
#   - admin, api-provision, forwarding-verify: true (Supabase verifies the
#     bearer JWT itself; the function then explicitly checks the decoded
#     claims — platform_admin/AAL2 for admin, tenant_id+role for the other
#     two — per CLAUDE.md Rule 2, RLS/JWT-verification alone is not treated
#     as sufficient for these).
[functions.voice-inbound]
verify_jwt = false
[functions.voice-tools]
verify_jwt = false
[functions.voice-events]
verify_jwt = false
[functions.webhooks-stripe]
verify_jwt = false
[functions.webhooks-twilio-sms]
verify_jwt = false
[functions.webhooks-outreach]
verify_jwt = false
[functions.webhooks-pos]
verify_jwt = false
[functions.api-demo-agent]
verify_jwt = false
[functions.worker-messages-outbound]
verify_jwt = false
[functions.worker-recording-fetch]
verify_jwt = false
[functions.worker-adapter-push]
verify_jwt = false
[functions.worker-tick]
verify_jwt = false
[functions.job-reconciliation]
verify_jwt = false
[functions.job-billing-cycle]
verify_jwt = false
[functions.job-reminder-scheduler]
verify_jwt = false
[functions.job-review-request]
verify_jwt = false
[functions.job-retell-health-failover]
verify_jwt = false
[functions.job-alert-evaluation]
verify_jwt = false
[functions.job-referral-payouts]
verify_jwt = false
[functions.job-commission-accrual]
verify_jwt = false
[functions.job-churn-scoring]
verify_jwt = false
[functions.job-value-email]
verify_jwt = false
[functions.job-offboarding]
verify_jwt = false
[functions.job-retention-sweep]
verify_jwt = false
[functions.job-keep-warm]
verify_jwt = false
[functions.webhooks-paypal]
verify_jwt = false
[functions.job-outreach-personalize]
verify_jwt = false
[functions.job-outreach-personalize-collect]
verify_jwt = false
# job-outreach-review-score (OUTREACH-2): phone-complaint review scoring,
# same x-cron-secret auth boundary as every other job-* function here.
[functions.job-outreach-review-score]
verify_jwt = false
# job-lead-callback-retry (FIX_REQUESTS.md): drains lead_callback_requests
# rows stuck in deferred_quiet_hours once scheduled_for has passed — same
# x-cron-secret auth boundary as every other job-* function below.
[functions.job-lead-callback-retry]
verify_jwt = false
# job-agent-regression (NIGHTLY-1): nightly Retell batch-test regression
# sweep over every test-* tenant — same x-cron-secret auth boundary as
# every other job-* function above.
[functions.job-agent-regression]
verify_jwt = false
[functions.admin]
verify_jwt = true
[functions.api-provision]
verify_jwt = true
[functions.api-checkout]
verify_jwt = true
[functions.api-a2p-register]
verify_jwt = true
[functions.api-outreach-fetch-leads]
verify_jwt = true
[functions.forwarding-verify]
verify_jwt = true
# api-adapter-connect (T7): tenant-owner/admin JWT verified by Supabase,
# then the function itself resolves tenant_id from `memberships` and
# additionally checks role in ('owner','admin') — same "JWT verification
# alone is not sufficient" posture as admin/api-provision above.
[functions.api-adapter-connect]
verify_jwt = true

# api-payment-link-resend: tenant-owner/admin JWT verified by Supabase,
# then the function checks the JWT's own app_metadata.tenant_id against the
# body-supplied tenant_id (docs/audit/FIX_REQUESTS.md, cluster D contract).
[functions.api-payment-link-resend]
verify_jwt = true

# api-lead-callback (GAP_REGISTER Cluster G item 2): server-to-server only
# (a tenant's own web-form backend or CRM integration, never a raw browser
# request) — authenticated by its own api_tokens bearer-token check
# (leads:write scope), not a Supabase-issued JWT, so Supabase's platform
# verify_jwt gate is off and this function is the sole auth boundary.
[functions.api-lead-callback]
verify_jwt = false

# api-menu-import / api-intake (GAP_REGISTER Cluster G items 3-4):
# api-menu-import is tenant-owner/admin JWT-authenticated (verify_jwt =
# true, then the function checks the JWT's own tenant membership, same
# posture as api-payment-link-resend above). api-intake is a PUBLIC
# endpoint (function name + contract match docs/audit/FIX_REQUESTS.md's
# already-built form page, not this cluster's own original naming) keyed
# by an opaque single-use token tied to one booking, carried as the
# remaining URL path — verify_jwt = false, the token itself is the entire
# auth boundary (fails closed on any missing/invalid/already-used/expired
# token).
[functions.api-menu-import]
verify_jwt = true
[functions.api-intake]
verify_jwt = false

# api-tenant-test-call (docs/audit/FIX_REQUESTS.md): tenant-owner/admin
# JWT-authenticated (verify_jwt = true, tenant_id from the JWT's own
# app_metadata only — same posture as api-menu-import above) — starts a
# Retell web-call session against the CALLING tenant's own already-
# published agent, for the dashboard's "test your agent" page.
[functions.api-tenant-test-call]
verify_jwt = true

# api-team-invite (docs/audit/FIX_REQUESTS.md): tenant-owner JWT-
# authenticated (verify_jwt = true, tenant_id + caller user id from the
# JWT only) — additionally re-verifies the caller's own memberships.role
# is 'owner' itself (handler.ts), since it runs as service role to mint a
# new auth user via GoTrue's admin invite endpoint and insert the
# resulting memberships row.
[functions.api-team-invite]
verify_jwt = true

# api-text-chat (Cluster T text-agent engine): PUBLIC — called directly,
# cross-origin, from an arbitrary tenant's own website (the embeddable
# widget's chat mode; docs/audit/CHANNELS_REQUESTS.md item 4). verify_jwt =
# false — there is no Supabase user session here at all; auth is the
# WIDGET_TOKEN_SECRET-signed `widget_token` apps/web's
# `POST /api/widget/session` mints (`_shared/text-agent/widget-token.ts`
# verifies it), and `conversation_token` is the separate per-conversation
# continuity credential the engine itself mints/re-verifies.
[functions.api-text-chat]
verify_jwt = false

# api-widget-voice-token (BUILD_PLAN Cluster W — the embeddable widget's
# Voice mode): PUBLIC, same posture as api-text-chat directly above —
# called from an arbitrary tenant's own website with no Supabase user
# session at all. Mints a Retell web-call token for the TENANT's own real
# published agent; auth is the same WIDGET_TOKEN_SECRET-signed
# `widget_token` (`_shared/widget-token.ts` verifies it independently here
# too, never trusting a caller-supplied tenant_id).
[functions.api-widget-voice-token]
verify_jwt = false

# api-admin-provision-test-tenant / api-admin-attach-retell-number /
# api-admin-run-agent-tests (CALL-1, docs/BUILD_PLAN.md): internal-only,
# never called with a Supabase user JWT — verify_jwt = false, same posture
# as worker-*/job-* above, except auth is a shared `x-internal-secret`
# header (timing-safe compared against PROVISION_INTERNAL_SECRET) rather
# than the cron secret, the SAME pattern api-provision/index.ts already
# uses for its own internal (service_role) call path.
[functions.api-admin-provision-test-tenant]
verify_jwt = false
[functions.api-admin-attach-retell-number]
verify_jwt = false
[functions.api-admin-run-agent-tests]
verify_jwt = false
# api-admin-create-web-call (CALL-5): same internal-only posture, for
# driving a real Retell web call with no Supabase session or widget_token
# (scripts/e2e/retell-web-call.ts).
[functions.api-admin-create-web-call]
verify_jwt = false
# api-admin-complete-test-checkout (SIGNUP-1): same internal-only posture —
# stands in for the tenant/membership-creation half of /api-checkout when
# Stripe is not configured, only ever for an explicitly `is_test = true`
# tenant (docs/BUILD_NOTES.md SIGNUP-1 entry).
[functions.api-admin-complete-test-checkout]
verify_jwt = false
