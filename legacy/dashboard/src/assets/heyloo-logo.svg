<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4df2ff" />
      <stop offset="40%" stop-color="#8c7bff" />
      <stop offset="100%" stop-color="#ff4fa2" />
    </linearGradient>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
    <filter id="neon">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur" />
      <feOffset dx="0" dy="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- hero stroke with smooth edges -->
  <g transform="translate(300 300)">
    <path
      d="M -90 110
         L -90 -110
         M -90 0
         Q -40 -70, 5 -35
         Q 45 -10, 95 -85
         L 95 110"
      fill="none"
      stroke="url(#pulse)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#neon)"
    />
  </g>

  <!-- HEYLOO text integrated into logo -->
  <text
    x="300"
    y="520"
    text-anchor="middle"
    font-family="Sora, 'Segoe UI', sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="8"
    fill="#ffffff"
    opacity="0.9">
    HEYLOO
  </text>
</svg>
